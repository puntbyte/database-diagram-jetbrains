# Enable Gradle Configuration Cache -> https://docs.gradle.org/current/userguide/configuration_cache.html
org.gradle.configuration-cache=true
# Enable Gradle Build Cache -> https://docs.gradle.org/current/userguide/build_cache.html
org.gradle.caching=true

# database-diagram-jetbrains/gradle.properties
#
# Path to the standalone web project.
# Can be absolute or relative to this build file.
# This file is gitignored ? each developer sets it to match their local layout.
#
# If you keep both repos as siblings in the same parent folder the default
# fallback in build.gradle.kts ("../database-diagram-web") already works and
# you don't need this file at all.
#
webProjectDir=../database-diagram-web
