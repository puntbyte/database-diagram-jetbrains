# Enable Gradle Configuration Cache -> https://docs.gradle.org/current/userguide/configuration_cache.html
org.gradle.configuration-cache=true
# Enable Gradle Build Cache -> https://docs.gradle.org/current/userguide/build_cache.html
org.gradle.caching=true

# ?? Memory settings ????????????????????????????????????????????????????????
#
# FIX: The Kotlin compiler daemon was running out of heap during compilation
# (GC overhead limit exceeded).  These settings give both the Gradle daemon
# and the Kotlin compiler daemon enough memory for the IntelliJ Platform SDK
# and the plugin source combined.
#
# Kotlin daemon heap  ? 2 GB is comfortable for an IntelliJ plugin project.
#   Increase to -Xmx3g if the error persists with a larger codebase.
kotlin.daemon.jvmargs=-Xmx2g -XX:+UseG1GC -XX:MaxGCPauseMillis=200

# Gradle daemon heap  ? 1.5 GB for the Gradle process itself.
org.gradle.jvmargs=-Xmx1500m -XX:+UseG1GC -XX:MaxGCPauseMillis=200

